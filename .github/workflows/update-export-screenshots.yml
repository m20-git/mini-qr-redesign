name: Update export screenshots

on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: export-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Generate and validate export screenshot candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Playwright matches the browser image
        run: node -e "if (require('@playwright/test/package.json').version !== '1.59.1') process.exit(1)"
      - name: Generate four candidate reference images
        run: pnpm exec playwright test --config=playwright.visual.config.ts --update-snapshots=all
      - name: Validate candidates in two repeated comparisons
        run: pnpm exec playwright test --config=playwright.visual.config.ts --update-snapshots=none --repeat-each=2
      - name: Upload candidates and report for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: export-screenshot-review-${{ github.sha }}
          path: |
            tests/e2e/create.spec.ts-snapshots/*-chromium-linux.png
            playwright-report/visual/
            test-results/visual/
          retention-days: 14
          if-no-files-found: warn
