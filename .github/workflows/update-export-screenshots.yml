name: Update export screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Generate export screenshot baselines for review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Regenerate the four export screenshot baselines
        env:
          CI: 'true'
        run: >-
          pnpm exec playwright test tests/e2e/create.spec.ts
          --project=chromium
          --grep 'should export as (PNG|JPG)'
          --update-snapshots=all
          --workers=1
          --retries=0

      - name: Upload screenshot baselines and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: export-screenshot-review-${{ github.sha }}
          path: |
            tests/e2e/create.spec.ts-snapshots/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Explain review and adoption
        if: always()
        run: |
          {
            echo '## Export screenshot review'
            echo
            echo "Source commit: $GITHUB_SHA"
            echo
            echo 'This workflow regenerates only the four PNG/JPG export screenshot baselines in the runner workspace.'
            echo 'Download the artifact and inspect the images and Playwright report before accepting any baseline.'
            echo 'If all four tests passed and the images match the intended design, commit the reviewed PNG files to tests/e2e/create.spec.ts-snapshots/ with their generated filenames unchanged.'
            echo 'No baseline files are committed automatically. The normal test workflow and screenshot tolerances are unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
