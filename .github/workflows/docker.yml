name: Docker PR build

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact event SHA checked by the caller
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    name: Build image (no publish)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR test commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver-opts: |
            image=moby/buildkit:v0.10.6
      - name: Build both architectures without registry credentials or push
        uses: docker/build-push-action@4a13e500e55cf31b7a5d59a38ab2040ab0f42f56
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64,linux/amd64
          push: false
          build-args: |
            VITE_APP_VERSION=pr-${{ github.event.number }}
