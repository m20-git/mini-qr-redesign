name: Visual tests

on:
  push:
    branches: [main, ci/separate-functional-and-visual-tests]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual review and baseline validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Playwright matches the browser image
        run: node -e "if (require('@playwright/test/package.json').version !== '1.59.1') process.exit(1)"
      - name: Compare against committed reference images
        id: compare
        continue-on-error: true
        run: pnpm exec playwright test --config=playwright.visual.config.ts --update-snapshots=none
      - name: Upload comparison report and diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-comparison
          path: |
            playwright-report/visual/
            test-results/visual/
          retention-days: 14
          if-no-files-found: warn
      - name: Generate candidate reference images
        id: generate
        run: pnpm exec playwright test --config=playwright.visual.config.ts --update-snapshots=all
      - name: Repeat comparison against candidates twice without retries
        id: repeat
        run: pnpm exec playwright test --config=playwright.visual.config.ts --update-snapshots=none --repeat-each=2
      - name: Record review status
        if: always()
        env:
          COMPARISON: ${{ steps.compare.outcome }}
          GENERATION: ${{ steps.generate.outcome }}
          REPEAT: ${{ steps.repeat.outcome }}
        run: |
          mkdir -p visual-review
          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('visual-review/status.json', JSON.stringify({
            commit: process.env.GITHUB_SHA,
            comparison: process.env.COMPARISON,
            generation: process.env.GENERATION,
            repeat: process.env.REPEAT,
            requiresHumanReview: true,
            baselinesCommitted: false
          }, null, 2));
          NODE
          {
            echo '## Visual review'
            echo "Comparison with committed baselines: $COMPARISON"
            echo "Candidate generation: $GENERATION"
            echo "Two repeated candidate comparisons: $REPEAT"
            echo 'A successful candidate run is not approval of the design.'
            echo 'No baseline or application files are committed automatically.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COMPARISON" = failure ]; then
            echo '::warning::Visual comparison failed. Inspect visual-comparison; candidate success does not erase the original mismatch.'
          fi
      - name: Upload candidates, validation report and source status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-candidates-for-review
          path: |
            tests/e2e/create.spec.ts-snapshots/*-chromium-linux.png
            playwright-report/visual/
            test-results/visual/
            visual-review/
          retention-days: 14
          if-no-files-found: warn

  baseline-pr:
    name: Prepare reviewed visual baseline PR
    needs: visual
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]' &&
      needs.visual.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Playwright matches the browser image
        run: node -e "if (require('@playwright/test/package.json').version !== '1.59.1') process.exit(1)"
      - name: Generate candidate reference images
        run: pnpm exec playwright test --config=playwright.visual.config.ts --update-snapshots=all
      - name: Validate candidates twice without retries
        run: pnpm exec playwright test --config=playwright.visual.config.ts --update-snapshots=none --repeat-each=2
      - name: Restrict candidate files
        run: |
          set -eu
          mkdir -p visual-baseline
          cp tests/e2e/create.spec.ts-snapshots/*-chromium-linux.png visual-baseline/
          find visual-baseline -type f -name '*.png' -print | sort
          count=$(find visual-baseline -type f -name '*.png' | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "Expected exactly 4 candidate PNG files, found $count." >&2
            exit 1
          fi
      - name: Detect reference image changes
        id: changes
        run: |
          set -eu
          changed=$(git status --porcelain -- tests/e2e/create.spec.ts-snapshots/*-chromium-linux.png || true)
          if [ -z "$changed" ]; then
            echo 'No committed visual baseline changed.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$changed"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare PR metadata
        if: steps.changes.outputs.changed == 'true'
        id: metadata
        run: |
          set -eu
          short_sha="${GITHUB_SHA::12}"
          branch="ci/visual-baselines/$short_sha"
          title="Update visual baseline images ($short_sha)"
          body=$(cat <<'EOF'
          ## Purpose

          This pull request updates only the four committed Chromium/Linux visual baseline PNG files.

          ## Safety

          - Generated only after candidate generation and two repeated visual comparisons succeeded.
          - No application code, workflow code, functional tests, Proxmox installers or other files are changed.
          - The visual comparison is advisory and does not approve the design by itself.
          - A maintainer must inspect the image diff before merging.

          ## Source

          - Main commit: $GITHUB_SHA
          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          )
          {
            echo "branch=$branch"
            echo "title=$title"
            cat <<EOF >> "$GITHUB_OUTPUT"
          body<<BODY_EOF
          $body
          BODY_EOF
          EOF
          } >> "$GITHUB_OUTPUT"
      - name: Create or update baseline branch
        if: steps.changes.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.metadata.outputs.branch }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin "$BRANCH" || true
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH" "origin/${GITHUB_REF_NAME}"
          fi
          git add tests/e2e/create.spec.ts-snapshots/*-chromium-linux.png
          if git diff --cached --quiet; then
            echo 'No staged baseline changes; nothing to publish.'
          else
            git commit -m "Update visual baseline images for ${GITHUB_SHA::12}"
            git push origin "$BRANCH"
          fi
      - name: Create or update baseline pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.metadata.outputs.branch }}
          TITLE: ${{ steps.metadata.outputs.title }}
          BODY: ${{ steps.metadata.outputs.body }}
        run: |
          set -eu
          existing=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$TITLE" --body "$BODY"
            echo "Updated existing visual baseline PR #$existing."
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
            echo 'Created visual baseline PR.'
          fi
